<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body>
<div th:fragment="skill (skill)">
  <style>
  .skill-wrapper {
    position: relative;
    width: 60px;
    height: 60px;
    margin-left: 10px;
    margin-right: 10px;
    margin-top: 5px;
    margin-bottom: 5px;
    display: flex;
    justify-content: center;  /* Centrage horizontal */
    align-items: center;      /* Centrage vertical */
    border-radius: 50%;
    background: white;
}
.skill-circle {
    display: inline-block;
    text-align: center;
    position: relative;
}

.skill-image {
    width: 40px; /* Taille de l'image fixée */
    height: 40px;
}

.skill-wrapper:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border-width: 5px;
    border-style: solid;
    border-color: grey;
    box-sizing: border-box;
}

.skill-wrapper.beginner:before {
    border-top-color: #3d6e9f;
    border-right-color: #3d6e9f;
}

.skill-wrapper.intermediate:before {
    border-top-color: #3d6e9f;
    border-right-color: #3d6e9f;
    border-bottom-color: #3d6e9f;
}

.skill-wrapper.advanced:before {
    border-color: #3d6e9f;
}

</style>

  <div class="skill-wrapper" th:classappend="${skill.level}">
    <img th:src="'/images/technologies/' + ${skill.skillName} + '.png'"
         th:alt="${skill.skillName}" class="skill-image"/>
  </div>
</div>

</body>
</html>
